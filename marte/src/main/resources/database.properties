# Database defaults for local development.
# In production, prefer environment variables:
# SIGP_DB_URL / SIGP_DB_HOST / SIGP_DB_PORT / SIGP_DB_NAME / SIGP_DB_USER / SIGP_DB_PASSWORD

# Optional full JDBC URL. If empty, host/port/name are used.
db.url=
db.host=localhost
db.port=5433
db.name=sigp
db.user=postgres
db.password=1234

# Initial seed users (only used when table "usuarios" is empty).
# Override with environment variables for secure deployments.
seed.admin.user=admin
seed.admin.password=admin123
seed.doctor.user=doctor.demo@mail.com
seed.doctor.password=doc1234
seed.patient.user=paciente.demo@mail.com
seed.patient.password=pac1234
